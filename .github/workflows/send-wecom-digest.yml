name: Send WeCom contest digest

on:
  push:
    paths:
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

concurrency:
  group: wecom-contest-digest
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, 'chore(data): daily contest refresh')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send daily contest digest
        env:
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
        run: python3 scripts/send_wecom.py
