name: Update contests

on:
  schedule:
    # 17:23 UTC = 01:23 Asia/Shanghai on the following calendar day.
    - cron: "23 17 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "README.template.md"
      - "README.md"

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify generated README
        run: python3 scripts/build_readme.py --check

  prune:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Remove expired contests and rebuild README
        run: python3 scripts/build_readme.py --prune
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contests.json README.md
          git commit -m "chore: remove expired contests"
          git push
